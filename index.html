<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MolMate — your mole concept companion. Convert between moles, number of particles, mass and gas volume, with notes, formulas and a periodic table."
    />
    <meta name="theme-color" content="#0f766e" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>MolMate — Your mole concept companion</title>

    <!-- Link previews (WhatsApp, Instagram, Telegram, X, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MolMate" />
    <meta property="og:url" content="https://mol-mate.vercel.app/" />
    <meta property="og:title" content="MolMate — Your mole concept companion" />
    <meta
      property="og:description"
      content="Convert moles, particles, mass and gas volume with step-by-step working. Notes, formula sheet and a 3D periodic table for KSSM Form 4 Chemistry."
    />
    <meta property="og:image" content="https://mol-mate.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MolMate logo with a glowing atom and the three mole formulas" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('molmate-theme')
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
